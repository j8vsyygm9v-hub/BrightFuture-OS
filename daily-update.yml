name: Bright Future Manual Update

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "要更新的板块"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update selected modules
        env:
          SELECTED_MODULES: ${{ inputs.modules }}
        run: python3 .github/scripts/update.py

      - name: Save updates
        run: |
          git config user.name "Bright Future Bot"
          git config user.email "brightfuture-bot@users.noreply.github.com"
          git add daily.json
          if git diff --cached --quiet; then
            echo "No new content."
          else
            git commit -m "Update selected workbench modules"
            git push
          fi
