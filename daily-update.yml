name: Bright Future Daily Update

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 北京时间次日 07:00
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily.json
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          BJ = timezone(timedelta(hours=8))
          today = datetime.now(BJ).strftime("%Y-%m-%d")

          feeds = {
              "ielts": [
                  ("BBC Learning English · 6 Minute English",
                   "https://feeds.bbci.co.uk/learningenglish/english/features/6-minute-english/rss")
              ],
              "politics": [
                  ("中国新闻网 · 时政",
                   "https://www.chinanews.com.cn/rss/china.xml"),
                  ("外交部领事服务",
                   "https://cs.mfa.gov.cn/gyls/lsgz/lqbb/rss_57447.xml")
              ],
              "law": [
                  ("中国新闻网 · 法治",
                   "https://www.chinanews.com.cn/rss/fz.xml")
              ],
              "finance": [
                  ("中国新闻网 · 财经",
                   "https://www.chinanews.com.cn/rss/finance.xml")
              ],
              "world": [
                  ("中国新闻网 · 国际",
                   "https://www.chinanews.com.cn/rss/world.xml")
              ]
          }

          def fetch_feed(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "BrightFuture-Daily/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read()

                  root = ET.fromstring(data)
                  result = []

                  for item in root.findall(".//item")[:5]:
                      title = item.findtext("title") or ""
                      link = item.findtext("link") or ""

                      title = " ".join(title.split())

                      if title and link:
                          result.append({
                              "title": title,
                              "link": link
                          })

                  return result

              except Exception as e:
                  print("Feed error:", url, e)
                  return []

          fresh = {}

          for key, sources in feeds.items():
              items = []

              for source_name, url in sources:
                  for item in fetch_feed(url):
                      item["source"] = source_name
                      items.append(item)

              fresh[key] = items[:5]

          # 读取现有 daily.json
          path = "daily.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {
                  "v": 2,
                  "date": today,
                  "brief": [],
                  "modules": {}
              }

          data["v"] = 2
          data["date"] = today

          # 生成首页速览
          brief = []

          mapping = [
              ("ielts", "国际视野", "ielts"),
              ("gongkao", "政治洞察", "politics"),
              ("law", "法律专业", "law"),
              ("finance", "财富管理", "finance"),
              ("sport", "卓越健康", None),
              ("intern", "职业成长", "world")
          ]

          for mid, tag, key in mapping:
              if key and fresh.get(key):
                  first = fresh[key][0]
                  text = first["title"]
              elif mid == "sport":
                  text = "完成今日约1小时运动，并进行拉伸与护眼。"
              elif mid == "intern":
                  text = "查看今日国际及就业环境相关信息，并扫描目标岗位。"
              else:
                  text = "今日暂无可读取的新信息，请进入官方来源查看最新内容。"

              brief.append({
                  "mid": mid,
                  "tag": tag,
                  "items": [text]
              })

          data["brief"] = brief

          # 给每个板块加入“今日真实资讯”
          def make_news_body(items, fallback_url):
              body = []

              if items:
                  body.append({
                      "type": "p",
                      "html": "<b>今日最新资讯</b>"
                  })

                  links = []

                  for item in items[:3]:
                      links.append({
                          "text": "→ " + item["title"] + " · " + item["source"],
                          "href": item["link"]
                      })

                  body.append({
                      "type": "links",
                      "items": links
                  })

              else:
                  body.append({
                      "type": "note",
                      "html": "今日自动抓取暂未取得新内容，请点击官方来源查看最新信息。"
                  })

                  body.append({
                      "type": "links",
                      "items": [
                          {
                              "text": "→ 查看官方来源",
                              "href": fallback_url
                          }
                      ]
                  })

              return body

          # 国际视野
          if "ielts" in data.get("modules", {}):
              tasks = data["modules"]["ielts"].get("tasks", [])
              if tasks:
                  tasks[0]["title"] = "今日 BBC 6 Minute English"
                  tasks[0]["body"] = make_news_body(
                      fresh["ielts"],
                      "https://www.bbc.co.uk/learningenglish"
                  )

          # 政治洞察
          if "gongkao" in data.get("modules", {}):
              tasks = data["modules"]["gongkao"].get("tasks", [])
              if tasks:
                  tasks[0]["title"] = "今日时政速览"
                  tasks[0]["body"] = make_news_body(
                      fresh["politics"],
                      "https://www.gov.cn/"
                  )

          # 法律专业
          if "law" in data.get("modules", {}):
              tasks = data["modules"]["law"].get("tasks", [])
              if tasks:
                  tasks[0]["title"] = "今日法律资讯"
                  tasks[0]["body"] = make_news_body(
                      fresh["law"],
                      "https://www.court.gov.cn/"
                  )

          # 财富管理
          if "finance" in data.get("modules", {}):
              tasks = data["modules"]["finance"].get("tasks", [])
              if tasks:
                  tasks[0]["title"] = "今日财经速览"
                  tasks[0]["body"] = make_news_body(
                      fresh["finance"],
                      "https://www.pbc.gov.cn/"
                  )

          # 职业成长
          if "intern" in data.get("modules", {}):
              tasks = data["modules"]["intern"].get("tasks", [])
              if tasks:
                  tasks[0]["title"] = "今日职业环境速览"
                  tasks[0]["body"] = make_news_body(
                      fresh["world"],
                      "https://www.iguopin.com/"
                  )

          # 保存
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("Bright Future updated:", today)
          print("Feeds collected:", {k: len(v) for k, v in fresh.items()})
          PY

      - name: Commit updated daily.json
        run: |
          git config user.name "Bright Future Bot"
          git config user.email "brightfuture-bot@users.noreply.github.com"

          git add daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily workbench"
            git push
          fi