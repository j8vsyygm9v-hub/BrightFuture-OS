<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Bright Future · 每日工作台</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#7b8497;
  --line:#e9edf4;
  --primary:#6474f4;
  --shadow:0 12px 35px rgba(40,52,90,.08);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(135deg,#f7f8ff 0%,#f5f8fc 50%,#f9f7ff 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:1320px;margin:auto;padding:28px 24px 70px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;margin-bottom:24px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;color:white;font-weight:800;
  background:linear-gradient(135deg,#6675f5,#8b65e9);
  box-shadow:0 8px 20px rgba(102,117,245,.25)
}
.brand h1{font-size:18px;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
.status{
  display:flex;align-items:center;gap:8px;
  background:white;border:1px solid var(--line);
  padding:9px 13px;border-radius:999px;font-size:12px;color:#566074
}
.dot{width:8px;height:8px;border-radius:50%;background:#31bd86}
.hero{
  background:linear-gradient(135deg,#111a35 0%,#283466 55%,#6655a7 100%);
  color:white;border-radius:30px;padding:34px;
  display:flex;justify-content:space-between;gap:30px;
  box-shadow:0 20px 50px rgba(32,43,86,.18);
  position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;width:280px;height:280px;
  border-radius:50%;right:-90px;top:-120px;
  background:rgba(255,255,255,.08)
}
.hero h2{font-size:34px;margin:0 0 10px;letter-spacing:-1px}
.hero p{margin:0;color:#cbd2e8;font-size:14px}
.hero-right{text-align:right;position:relative;z-index:1}
.date{font-size:22px;font-weight:700}
.version{margin-top:8px;font-size:12px;color:#cdd4eb}
.section-title{
  display:flex;justify-content:space-between;align-items:end;
  margin:30px 2px 15px
}
.section-title h3{margin:0;font-size:19px}
.section-title span{font-size:12px;color:var(--muted)}
.priority{
  display:grid;gap:9px;margin-bottom:4px
}
.priority-item{
  background:white;border:1px solid var(--line);border-radius:15px;
  padding:12px 15px;display:flex;align-items:center;gap:12px;
  box-shadow:0 5px 18px rgba(30,40,70,.04)
}
.priority-item.overdue{border-left:4px solid #ef6679}
.priority-tag{
  min-width:78px;text-align:center;padding:5px 8px;
  border-radius:8px;background:#f0f2ff;color:#5d68d9;font-size:11px;font-weight:700
}
.priority-text{font-size:13px;flex:1}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px
}
.module{
  min-height:190px;border-radius:24px;padding:24px;
  color:white;position:relative;overflow:hidden;
  transition:.22s transform,.22s box-shadow;cursor:pointer
}
.module:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(30,40,80,.14)}
.module:after{
  content:"";position:absolute;width:170px;height:170px;
  border-radius:50%;right:-55px;bottom:-75px;background:rgba(255,255,255,.11)
}
.module .role{
  display:inline-block;background:rgba(255,255,255,.18);
  padding:5px 9px;border-radius:999px;font-size:11px
}
.module h4{font-size:26px;margin:20px 0 7px}
.module p{font-size:12px;opacity:.85;margin:0}
.progress-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:24px;font-size:12px
}
.progress{
  width:100px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden
}
.progress i{display:block;height:100%;background:white;border-radius:9px}
.blue{background:linear-gradient(135deg,#448af0,#6575f4)}
.pink{background:linear-gradient(135deg,#ec6798,#e85d79)}
.cyan{background:linear-gradient(135deg,#17b7c5,#39a9d0)}
.orange{background:linear-gradient(135deg,#eda03d,#ef7659)}
.green{background:linear-gradient(135deg,#26b986,#4ba875)}
.purple{background:linear-gradient(135deg,#866be8,#6656bf)}
.brief{
  background:white;border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);overflow:hidden
}
.brief-row{
  display:flex;align-items:center;gap:12px;padding:15px 18px;
  border-bottom:1px solid var(--line)
}
.brief-row:last-child{border-bottom:0}
.brief-tag{
  width:90px;flex:none;font-size:11px;font-weight:700;
  color:#5c66d4;background:#f0f2ff;border-radius:8px;padding:6px;text-align:center
}
.brief-text{font-size:13px;line-height:1.6}
.tasks-area{
  background:white;border:1px solid var(--line);border-radius:22px;
  padding:18px;box-shadow:var(--shadow)
}
.add-task{display:flex;gap:10px}
.add-task input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;font-size:16px;outline:none
}
.add-task input:focus{border-color:#8993ed}
.btn{
  min-height:44px;border:0;border-radius:12px;padding:0 16px;
  background:#6675f4;color:white;font-weight:700
}
.btn.secondary{background:#f0f2f8;color:#4f5870}
.custom-task{
  display:flex;align-items:center;gap:12px;margin-top:10px;
  padding:12px;background:#f8f9fc;border-radius:13px
}
.custom-task input{width:20px;height:20px}
.custom-task.done .ctext{text-decoration:line-through;color:#9ba2b1}
.delete{margin-left:auto;color:#ef6679;background:none;border:0;font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.file-label{display:inline-flex;align-items:center}
.hidden{display:none!important}

/* detail */
#viewDetail{display:none}
.detail-head{
  display:flex;align-items:center;gap:12px;margin-bottom:24px
}
.back{
  width:44px;height:44px;border-radius:13px;border:1px solid var(--line);
  background:white;color:#424b60
}
.detail-head h2{margin:0;font-size:24px}
.detail-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.detail-section{display:none}
.detail-section.active{display:block}
.module-head{
  border-radius:24px;padding:25px;color:white;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:20px
}
.module-head h2{margin:0 0 6px}
.module-head p{margin:0;opacity:.82;font-size:13px}
.ring{
  width:72px;height:72px;border-radius:50%;
  background:conic-gradient(white var(--p),rgba(255,255,255,.2) 0);
  display:grid;place-items:center;flex:none
}
.ring:after{
  content:attr(data-value);width:57px;height:57px;border-radius:50%;
  background:rgba(20,30,65,.5);display:grid;place-items:center;font-size:12px;font-weight:700
}
.detail-task{
  background:white;border:1px solid var(--line);border-radius:18px;
  margin-bottom:12px;overflow:hidden
}
.task-head{
  min-height:68px;display:flex;align-items:center;gap:13px;padding:13px 16px
}
.task-check{width:21px;height:21px;flex:none}
.task-title{flex:1;cursor:pointer}
.task-title strong{display:block;font-size:14px}
.task-title small{display:block;color:var(--muted);margin-top:4px}
.time{
  padding:5px 9px;background:#f1f3f8;border-radius:8px;
  color:#667085;font-size:11px;white-space:nowrap
}
.task-body{
  display:none;padding:0 18px 18px 52px;
  color:#4d5668;font-size:13px;line-height:1.75
}
.detail-task.open .task-body{display:block}
.body-block{margin:10px 0}
.body-note{background:#f7f8fb;border-radius:10px;padding:10px 12px;color:#737c8e}
.body-table-wrap{overflow:auto}
.body-table{border-collapse:collapse;width:100%;min-width:500px}
.body-table th,.body-table td{border:1px solid #e7eaf1;padding:9px;text-align:left}
.body-table th{background:#f6f7fa}
.question{
  background:#f7f8ff;border-left:3px solid #6876e8;padding:12px;border-radius:9px
}
.link-list a{display:block;color:#5666d8;text-decoration:none;margin:7px 0}
.link-list a:hover{text-decoration:underline}
.job{
  border:1px solid #e7eaf1;border-radius:12px;padding:12px;margin:9px 0
}
.job strong{display:block;margin-bottom:4px}
.job-meta{font-size:12px;color:#788194;margin-bottom:7px}

.empty{
  text-align:center;color:var(--muted);padding:35px
}
.footer{
  text-align:center;color:#9aa2b1;font-size:11px;margin-top:30px
}

@media(max-width:767px){
  .app{padding:15px 14px 50px}
  .topbar{margin-bottom:14px}
  .hero{padding:23px;border-radius:23px;display:block}
  .hero h2{font-size:27px}
  .hero-right{text-align:left;margin-top:20px}
  .grid{grid-template-columns:1fr}
  .module{min-height:165px;padding:21px}
  .module h4{font-size:24px;margin-top:16px}
  .brief-row{align-items:flex-start}
  .brief-tag{width:76px}
  .add-task{flex-direction:column}
  .module-head{padding:20px}
  .module-head h2{font-size:20px}
  .task-body{padding-left:18px}
  .time{display:none}
}
</style>
</head>

<body>

<div class="app">

  <div id="viewHome">

    <header class="topbar">
      <div class="brand">
        <div class="logo">BF</div>
        <div>
          <h1>Bright Future</h1>
          <p>私人每日成长工作台</p>
        </div>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span id="syncStatus">本地已保存</span>
      </div>
    </header>

    <section class="hero">
      <div>
        <h2>Bright Future · 每日工作台</h2>
        <p>把每天真正重要的事情，集中到一个地方。</p>
      </div>
      <div class="hero-right">
        <div class="date" id="todayDate"></div>
        <div class="version" id="versionText">正在读取今日内容…</div>
      </div>
    </section>

    <div class="section-title">
      <h3>今天要处理</h3>
      <span id="priorityCount">0 项</span>
    </div>
    <div id="priorityList" class="priority"></div>

    <div class="section-title">
      <h3>六大成长领域</h3>
      <span>点击进入详细任务</span>
    </div>

    <main id="moduleGrid" class="grid"></main>

    <div class="section-title">
      <h3>今日速览</h3>
      <span>六大板块 · 每日更新</span>
    </div>
    <div id="brief" class="brief"></div>

    <div class="section-title">
      <h3>任意台</h3>
      <span>临时任务</span>
    </div>

    <section class="tasks-area">
      <div class="add-task">
        <input id="customInput" type="text" maxlength="200" placeholder="添加今天临时想完成的事情…">
        <button class="btn" id="addTaskBtn">添加任务</button>
      </div>
      <div id="customTasks"></div>
    </section>

    <div class="section-title">
      <h3>数据备份</h3>
      <span>建议定期导出</span>
    </div>

    <div class="tools">
      <button class="btn secondary" id="exportBtn">导出 JSON 备份</button>
      <label class="btn secondary file-label">
        导入 JSON
        <input id="importInput" class="hidden" type="file" accept=".json,application/json">
      </label>
      <button class="btn secondary" id="clearBtn">清空本地数据</button>
    </div>

    <div class="footer">
      Bright Future · Private Workbench
    </div>
  </div>


  <div id="viewDetail">

    <div class="detail-head">
      <button class="back" id="backBtn" aria-label="返回首页">←</button>
      <div>
        <h2>今日工作台</h2>
        <p id="detailDate"></p>
      </div>
    </div>

    <div id="detailSections"></div>

    <div class="footer">
      Bright Future · Private Workbench
    </div>
  </div>

</div>

  ✓ 统一由 refreshAll() 调度
  ✓ localStorage 首次打开不会出现空白
  ✓ 跨月、跨年使用系统日期自动计算

    tids:["in_1","in_2","in_3"]

const FALLBACK = {
  ielts:{
    sub:"听力精练 · 口语输出 · 词块记忆",
    tasks:[
      {
        tid:"ielts_1",title:"BBC 6 Minute English 精听",time:"40 分钟",
        hint:"听一遍、精听一遍，再记录 5 个高频表达。",
        body:[
          {type:"p",html:"今天选择 BBC Learning English 的 <b>6 Minute English</b> 任意最新一期进行精听。"},
          {type:"ul",items:["第一遍：不看字幕理解大意","第二遍：暂停记录生词和表达","最后：用英文复述主题"]},

      },

        ]
      },
      {
        tid:"ielts_3",title:"雅思口语迁移训练",time:"15 分钟",
        hint:"把今天听到的表达迁移到自己的口语答案。",

      {

  },

  finance:{
    sub:"知识点 · 市场速览 · 实操任务",
    tasks:[
      {
        tid:"fin_1",title:"A 股市场观察",time:"20 分钟",

        body:[
          {type:"p",html:"关注上证指数、深证成指、创业板指及主要行业表现。实际点位以交易所或正规行情平台当日数据为准。"},
          {type:"links",items:[
            {text:"→ 上海证券交易所",href:"https://www.sse.com.cn/"},

      {

/* =========================
   数据层
========================= */

let state = loadState();
let dailyContent = loadDailyContent();

function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s && typeof s==="object") return s;
    }
  }catch(e){}
  return {
    date:today(),
    completed:{},
    customTasks:[],
    exampleShown:true
  };
}

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function loadDailyContent(){
  try{
    const raw=localStorage.getItem(DAILY_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d && d.v===2 && d.modules) return d;
    }
  }catch(e){}
  return buildFallbackContent();
}

function buildFallbackContent(){
  const date=today();
  const modules={};
  Object.keys(FALLBACK).forEach(id=>{
    modules[id]={
      sub:FALLBACK[id].sub,
      tasks:FALLBACK[id].tasks
    };
  });

  return {
    v:2,
    date,
    brief:[
      {mid:"ielts",tag:"国际视野",items:["今天完成一次精听 + 影子跟读。"]},
      {mid:"gongkao",tag:"政治洞察",items:["关注近期政策与时政热点。"]},
      {mid:"law",tag:"法律专业",items:["精读一个案例或前沿观点。"]},
      {mid:"finance",tag:"财富管理",items:["观察市场，不急于交易。"]},
      {mid:"sport",tag:"卓越健康",items:["完成今天的主体运动与拉伸。"]},
      {mid:"intern",tag:"职业成长",items:["扫描岗位并完成一次有效行动。"]}
    ],
    modules
  };
}


/* =========================
   安全层
========================= */

function sanitizeHtml(html){
  const template=document.createElement("template");
  template.innerHTML=String(html ?? "");

  const bad=[
    "script","style","iframe","object","embed","link","meta",
    "base","form"
  ];

  template.content.querySelectorAll("*").forEach(el=>{
    if(bad.includes(el.tagName.toLowerCase())){
      el.remove();
      return;
    }

    [...el.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      const value=attr.value || "";

      if(name.startsWith("on") || name==="style"){
        el.removeAttribute(attr.name);
      }

      if(["href","src","action","formaction"].includes(name)){
        el.setAttribute(attr.name,safeUrl(value));
      }
    });
  });

  return template.innerHTML;
}

function safeUrl(u){
  const value=String(u ?? "").trim();

  if(
    value.startsWith("#") ||
    value.startsWith("/") ||
    /^https?:\/\//i.test(value) ||
    /^mailto:/i.test(value)
  ) return value;

  return "#";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   计算层
========================= */

function moduleTasks(id){
  const detail=dailyContent.modules?.[id];
  const fallback=FALLBACK[id];

  const source=detail?.tasks || [];
  const map={};

  source.forEach(t=>{
    if(t && t.tid) map[t.tid]=t;
  });

  return MODULES[id].tids.map(tid=>{
    return map[tid] || fallback.tasks.find(t=>t.tid===tid);
  }).filter(Boolean);
}

function moduleProgress(id){
  const tasks=moduleTasks(id);
  const done=tasks.filter(t=>state.completed[t.tid]).length;
  return {
    done,
    total:tasks.length,
    percent:tasks.length ? Math.round(done/tasks.length*100):0
  };
}

function allTasks(){
  const arr=[];
  Object.keys(MODULES).forEach(id=>{
    moduleTasks(id).forEach(t=>{
      arr.push({...t,moduleId:id,moduleName:MODULES[id].name});
    });
  });
  return arr;
}


/* =========================
   渲染层
========================= */

function renderDate(){
  document.getElementById("todayDate").textContent=today();
  document.getElementById("detailDate").textContent=`内容日期：${dailyContent.date || today()}`;

  if(dailyContent.date===today()){
    document.getElementById("versionText").textContent="六大板块 · 今日内容";
  }else{
    document.getElementById("versionText").textContent=
      `内容日期 ${dailyContent.date || "未知"}`;
  }
}

function renderPriority(){
  const box=document.getElementById("priorityList");
  const tasks=allTasks();
  const pending=tasks.filter(t=>!state.completed[t.tid]).slice(0,5);

  document.getElementById("priorityCount").textContent=`${pending.length} 项`;

  if(!pending.length){
    box.innerHTML=`<div class="priority-item">
      <div class="priority-tag">今日状态</div>
      <div class="priority-text">六大板块任务全部完成，今天做得很好。</div>
    </div>`;
    return;
  }

  box.innerHTML=pending.map(t=>`
    <div class="priority-item">
      <div class="priority-tag">${escapeHtml(t.moduleName)}</div>
      <div class="priority-text">${escapeHtml(t.title)}</div>
      <button class="btn secondary" data-open="${escapeHtml(t.moduleId)}">处理</button>
    </div>
  `).join("");

  box.querySelectorAll("[data-open]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      openDetail(btn.dataset.open);
    });
  });
}

function renderGridView(){
  const box=document.getElementById("moduleGrid");

  box.innerHTML=Object.entries(MODULES).map(([id,m])=>{
    const p=moduleProgress(id);

    return `
      <article class="module ${m.color}" data-module="${id}">
        <span class="role">${escapeHtml(m.role)}</span>
        <h4>${escapeHtml(m.name)}</h4>
        <p>${escapeHtml(m.sub)}</p>
        <div class="progress-row">
          <span>${p.done}/${p.total} 已完成</span>
          <div class="progress"><i style="width:${p.percent}%"></i></div>
        </div>
      </article>
    `;
  }).join("");

  box.querySelectorAll("[data-module]").forEach(card=>{
    card.addEventListener("click",()=>{
      openDetail(card.dataset.module);
    });
  });
}

function renderBrief(){
  const box=document.getElementById("brief");
  const fallback=buildFallbackContent();

  const brief=dailyContent.brief?.length
    ? dailyContent.brief
    : fallback.brief;

  box.innerHTML=brief.map(item=>`
    <div class="brief-row">
      <div class="brief-tag">${escapeHtml(item.tag || MODULES[item.mid]?.name || "")}</div>
      <div class="brief-text">${escapeHtml(item.items?.[0] || "")}</div>
    </div>
  `).join("");
}

function renderTodaySection(){
  renderPriority();
}

function renderStats(){
  const total=allTasks().length;
  const done=allTasks().filter(t=>state.completed[t.tid]).length;
  const percent=total?Math.round(done/total*100):0;

  document.title=`Bright Future · ${percent}%`;
}

function renderCustomTasks(){
  const box=document.getElementById("customTasks");

  if(!state.customTasks.length){
    box.innerHTML=`<div class="empty">还没有临时任务</div>`;
    return;
  }

  box.innerHTML=state.customTasks.map(t=>`
    <div class="custom-task ${t.done?"done":""}">
      <input type="checkbox" ${t.done?"checked":""} data-custom-check="${t.id}">
      <span class="ctext">${escapeHtml(t.text)}</span>
      ${t.done
        ? `<button class="delete" data-custom-delete="${t.id}">删除</button>`
        : ""}
    </div>
  `).join("");

  box.querySelectorAll("[data-custom-check]").forEach(el=>{
    el.addEventListener("change",()=>{
      const id=el.dataset.customCheck;
      const task=state.customTasks.find(t=>t.id===id);
      if(task) task.done=el.checked;
      saveState();
      refreshAll();
    });
  });

  box.querySelectorAll("[data-custom-delete]").forEach(el=>{
    el.addEventListener("click",()=>{
      state.customTasks=state.customTasks.filter(t=>t.id!==el.dataset.customDelete);
      saveState();
      refreshAll();
    });
  });
}

function renderBody(body){
  if(!Array.isArray(body)) return "";

  return body.map(block=>{
    if(!block || !block.type) return "";

    switch(block.type){

      case "p":
        return `<div class="body-block">${sanitizeHtml(block.html)}</div>`;

      case "note":
        return `<div class="body-block body-note">${sanitizeHtml(block.html)}</div>`;

      case "ul":
        return `<ul class="body-block">${
          (block.items||[]).map(x=>`<li>${sanitizeHtml(x)}</li>`).join("")
        }</ul>`;

      case "table":
        return `
          <div class="body-block body-table-wrap">
            <table class="body-table">
              <thead><tr>${(block.head||[]).map(x=>`<th>${sanitizeHtml(x)}</th>`).join("")}</tr></thead>
              <tbody>
                ${(block.rows||[]).map(row=>`
                  <tr>${row.map(x=>`<td>${sanitizeHtml(x)}</td>`).join("")}</tr>
                `).join("")}
              </tbody>
            </table>
            ${block.caption?`<div class="body-note">${sanitizeHtml(block.caption)}</div>`:""}
          </div>
        `;

      case "q":
        return `
          <div class="body-block question">
            <b>${sanitizeHtml(block.qh)}</b>
            <div>${(block.opts||[]).map(x=>`<div>${sanitizeHtml(x)}</div>`).join("")}</div>
            <div style="margin-top:8px"><b>${sanitizeHtml(block.ansLabel)}</b></div>
            <div>${sanitizeHtml(block.ansHtml)}</div>
          </div>
        `;

      case "job":
        return `
          <div class="job">
            <strong>${sanitizeHtml(block.jn)}</strong>
            <div class="job-meta">${sanitizeHtml(block.jm)}</div>
            <div>${sanitizeHtml(block.jd)}</div>
            <a href="${safeUrl(block.applyHref)}" target="_blank" rel="noopener">
              ${sanitizeHtml(block.applyText || "→ 查看")}
            </a>
          </div>
        `;

      case "star":
        return `
          <div class="body-block body-note">
            <b>${sanitizeHtml(block.title)}</b><br>
            ${sanitizeHtml(block.html)}
          </div>
        `;

      case "links":
        return `
          <div class="body-block link-list">
            ${(block.items||[]).map(x=>`
              <a href="${safeUrl(x.href)}" target="_blank" rel="noopener">
                ${sanitizeHtml(x.text)}
              </a>
            `).join("")}
          </div>
        `;

      default:
        return "";
    }
  }).join("");
}

function renderDetailSections(){
  const box=document.getElementById("detailSections");

  box.innerHTML=Object.entries(MODULES).map(([id,m])=>{
    const p=moduleProgress(id);
    const tasks=moduleTasks(id);

    return `
      <section class="detail-section" id="detail-${id}">
        <div class="module-head ${m.color}">
          <div>
            <h2>${escapeHtml(m.name)}</h2>
            <p>${escapeHtml(dailyContent.modules?.[id]?.sub || m.sub)}</p>
          </div>
          <div class="ring" style="--p:${p.percent}%" data-value="${p.done}/${p.total}"></div>
        </div>

        ${tasks.map(t=>`
          <article class="detail-task">
            <div class="task-head">
              <input
                class="task-check"
                type="checkbox"
                data-task="${escapeHtml(t.tid)}"
                ${state.completed[t.tid]?"checked":""}
              >
              <div class="task-title" data-expand="${escapeHtml(t.tid)}">
                <strong>${escapeHtml(t.title)}</strong>
                <small>${escapeHtml(t.hint || "")}</small>
              </div>
              <span class="time">${escapeHtml(t.time || "")}</span>
            </div>
            <div class="task-body">
              ${renderBody(t.body)}
            </div>
          </article>
        `).join("")}
      </section>
    `;
  }).join("");

  box.querySelectorAll("[data-task]").forEach(el=>{
    el.addEventListener("change",()=>{
      state.completed[el.dataset.task]=el.checked;
      saveState();
      refreshAll();

      const active=document.querySelector(".detail-section.active");
      if(active) active.classList.add("active");
    });
  });

  box.querySelectorAll("[data-expand]").forEach(el=>{
    el.addEventListener("click",()=>{
      const article=el.closest(".detail-task");
      article.classList.toggle("open");
    });
  });
}


/* =========================
   统一刷新入口
========================= */

function refreshAll(){
  renderDate();
  renderDetailSections();
  renderBrief();
  renderGridView();
  renderTodaySection();
  renderStats();
  renderCustomTasks();
}


/* =========================
   页面视图
========================= */

let lastScrollY=0;

function openDetail(id){
  lastScrollY=window.scrollY;

  document.getElementById("viewHome").style.display="none";
  document.getElementById("viewDetail").style.display="block";

  document.querySelectorAll(".detail-section").forEach(s=>{
    s.classList.remove("active");
  });

  const target=document.getElementById(`detail-${id}`);
  if(target) target.classList.add("active");

  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById("viewDetail").style.display="none";
  document.getElementById("viewHome").style.display="block";
  window.scrollTo(0,lastScrollY);
}


/* =========================
   每日内容读取
========================= */

async function loadLatestDaily(){
  try{
    const response=await fetch(`daily.json?v=${Date.now()}`,{
      cache:"no-store"
    });

    if(!response.ok) throw new Error("daily.json unavailable");

    const remote=await response.json();

    if(remote && remote.v===2 && remote.modules){
      dailyContent=remote;
      localStorage.setItem(DAILY_KEY,JSON.stringify(remote));
      document.getElementById("syncStatus").textContent="今日内容已读取";
      refreshAll();
    }
  }catch(error){
    document.getElementById("syncStatus").textContent="本地内容模式";
  }
}


/* =========================
   跨天检测
========================= */

function checkNewDay(){
  const current=today();

  if(state.date!==current){
    state.date=current;
    state.completed={};
    state.customTasks=state.customTasks.filter(t=>!t.done);
    saveState();

    dailyContent=buildFallbackContent();
    localStorage.setItem(DAILY_KEY,JSON.stringify(dailyContent));

    refreshAll();
    loadLatestDaily();
  }
}


/* =========================
   事件
========================= */

function bindEvents(){

  document.getElementById("backBtn").addEventListener("click",closeDetail);

  document.getElementById("addTaskBtn").addEventListener("click",addCustomTask);

  document.getElementById("customInput").addEventListener("keydown",e=>{
    if(e.key==="Enter") addCustomTask();
  });

  document.getElementById("exportBtn").addEventListener("click",exportBackup);

  document.getElementById("importInput").addEventListener("change",importBackup);

  document.getElementById("clearBtn").addEventListener("click",()=>{
    const ok=confirm(
      "确定要清空本地工作台数据吗？\n\n已完成任务和临时任务将被删除。"
    );

    if(!ok) return;

    localStorage.removeItem(STORAGE_KEY);
    state=loadState();
    refreshAll();
  });
}

function addCustomTask(){
  const input=document.getElementById("customInput");
  const text=input.value.trim();

  if(!text) return;

  state.customTasks.push({
    id:`custom_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    text,
    done:false
  });

  input.value="";
  saveState();
  refreshAll();
}

function exportBackup(){
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    state
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`BrightFuture_backup_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file=event.target.files?.[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const imported=data.state || data;

      if(
        !imported ||
        typeof imported!=="object" ||
        !imported.completed ||
        !Array.isArray(imported.customTasks)
      ){
        throw new Error("invalid");
      }

      state=imported;
      saveState();
      refreshAll();

      alert("数据恢复成功。");
    }catch(e){
      alert("导入失败：文件格式不正确。");
    }

    event.target.value="";
  };

  reader.readAsText(file);
}


/* =========================
   初始化
========================= */

document.addEventListener("DOMContentLoaded",()=>{

  // 初始化顺序：
  // 加载本地数据 → 跨天检测 → 渲染 → 加载每日内容 → 绑定事件
  checkNewDay();

  refreshAll();

  bindEvents();

  loadLatestDaily();

  setInterval(checkNewDay,60000);

});
</script>
