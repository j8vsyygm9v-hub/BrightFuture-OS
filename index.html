<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1020;--panel:#131b2e;--panel2:#18233a;
  --text:#eef3ff;--muted:#9ba9c3;--line:#293650;
  --accent:#a7c7ff;--green:#86e3bf;--radius:20px
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2d4c 0,transparent 42%),var(--bg);

button,a,input,textarea{font:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:32px 24px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:52px}
.brand{font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:800}
.status{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:7px 12px;border-radius:99px}
.hero{margin-bottom:32px}
.eyebrow{color:var(--green);font-size:12px;letter-spacing:3px;font-weight:700}
h1{font-size:clamp(34px,6vw,58px);letter-spacing:-2px;line-height:1.15;margin:14px 0}
.hero p{max-width:650px;color:var(--muted);margin:0}
.date-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:13px}
.progress-wrap{background:#11192a;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:28px 0 34px}
.progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:13px}
.progress-head span:last-child{color:var(--green)}
.progress{height:5px;background:#2a3650;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#83e3c1,#a7c7ff);transition:width .2s}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:38px 0 18px}
.section-head h2{font-size:20px;margin:0}
.section-head p{font-size:12px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;text-align:left;background:linear-gradient(145deg,#18233a,#11192a);border:1px solid var(--line);border-radius:var(--radius);padding:23px;min-height:205px;color:var(--text);transition:transform .18s,border-color .18s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:#627da8}
.card::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-55px;top:-55px;background:var(--glow,#a7c7ff);opacity:.08}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.card-icon{font-size:25px}
.card-number{font-size:11px;color:var(--muted);letter-spacing:2px}
.card h3{font-size:23px;margin:0 0 5px;letter-spacing:.5px}
.card p{color:var(--muted);font-size:13px;margin:0}
